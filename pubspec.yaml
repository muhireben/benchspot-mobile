name: benchspot
description: Bench Spot mobile prototype for discovering and reviewing benches.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.5.0
  image: ^4.5.4
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/autumn-bench.png
    - assets/benchspot-icon.png
